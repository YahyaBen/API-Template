# Start ../deployment/rabbitmq first, then combine this with docker-compose.yml.
services:
  api:
    env_file:
      - ../deployment/rabbitmq/.env
    environment:
      Outbox__Enabled: "true"
      Outbox__Transport: RabbitMq
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
    # Foodiya.API uses port 8080; this exposes Identity on 8081.
    ports: !override
      - "8081:8080"
    networks:
      - default
      - messaging

networks:
  messaging:
    name: foodiya-messaging
    external: true
