<!doctype html>
<html lang="{{language_code}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}}</title>
</head>
<body dir="{{direction}}" style="margin:0;padding:0;background:#f7f4f4;color:#352525;font-family:Arial,Helvetica,sans-serif;direction:{{direction}};text-align:{{text_align}};">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f4f4;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #eadede;border-radius:16px;overflow:hidden;">
        <tr><td style="background:#356767;padding:24px 32px;color:#ffffff;font-size:28px;font-weight:700;letter-spacing:.5px;">foodiya.app.Identity</td></tr>
        <tr><td style="height:5px;background:#c83d4d;"></td></tr>
        <tr><td style="padding:36px 32px;">
          <p style="margin:0 0 12px;font-size:16px;">{{greeting}}</p>
          <h1 style="margin:0 0 14px;font-size:26px;line-height:1.25;color:#9f2635;">{{heading}}</h1>
          <p style="margin:0 0 20px;color:#5f4d4f;font-size:16px;line-height:1.6;">{{message}}</p>
          <div style="padding:15px 16px;background:#fff3cd;border-inline-start:4px solid #d8a000;border-radius:8px;color:#725400;font-size:14px;line-height:1.5;">{{impact_notice}}</div>
          <div style="margin:24px 0;padding:22px;text-align:center;background:#fff3f4;border-inline-start:4px solid #c83d4d;border-radius:10px;">
            <div style="font-size:13px;color:#765b5f;text-transform:uppercase;letter-spacing:1px;">{{code_label}}</div>
            <div style="margin-top:8px;color:#b22e3e;font-family:'Courier New',monospace;font-size:36px;font-weight:700;letter-spacing:7px;">{{code}}</div>
          </div>
          <p style="margin:0 0 8px;font-size:14px;color:#716064;"><strong>{{challenge_reference_label}}</strong> {{challenge_id}}</p>
          <p style="margin:0 0 24px;font-size:14px;color:#716064;"><strong>{{expires_label}}</strong> {{expires_at}}</p>
          <div style="padding:14px 16px;background:#f7e3e6;border-radius:8px;color:#7a2833;font-size:14px;line-height:1.5;">{{safety_notice}}</div>
        </td></tr>
        <tr><td style="padding:20px 32px;background:#faf8f8;color:#7a6c6e;font-size:13px;line-height:1.5;">{{footer}}</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
