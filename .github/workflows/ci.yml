name: Build and verify APIs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Ci-Test-${{ github.run_id }}-Only!9'
          SQLCMDPASSWORD: 'Ci-Test-${{ github.run_id }}-Only!9'
        ports:
          - '127.0.0.1:1433:1433'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore API-Template.slnx
      - name: Build
        run: dotnet build API-Template.slnx --configuration Release --no-restore
      - name: Publish Foodiya API
        run: >-
          dotnet publish Foodiya.API/Foodiya.API.csproj --configuration Release
          --no-build --no-restore --output artifacts/publish/api
      - name: Publish Identity API
        run: >-
          dotnet publish foodiya.app.Identity.Api/foodiya.app.Identity.Api.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/publish/identity
      - name: Verify HTTP startup without external dependencies
        run: bash scripts/Test-ApiStartup.sh
      - name: Verify authorization and authentication against isolated SQL databases
        shell: pwsh
        env:
          SQLCMDPASSWORD: 'Ci-Test-${{ github.run_id }}-Only!9'
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
        run: >-
          ./scripts/Test-Integration.ps1 -Server 'localhost,1433'
          -UseSqlAuthentication -SqlServerContainer '${{ job.services.sqlserver.id }}'
