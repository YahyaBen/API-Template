# Initialize the Foodiya database before enabling this consumer.
services:
  api:
    env_file:
      - ./deployment/rabbitmq/.env
    environment:
      IdentityEvents__Enabled: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
    networks:
      - default
      - messaging

networks:
  messaging:
    name: foodiya-messaging
    external: true
