<!doctype html>
<html lang="{{language_code}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}}</title>
</head>
<body dir="{{direction}}" style="margin:0;padding:0;background:#f3f7f5;color:#18332b;font-family:Arial,Helvetica,sans-serif;direction:{{direction}};text-align:{{text_align}};">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f7f5;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dce8e2;border-radius:16px;overflow:hidden;">
        <tr><td style="background:#356767;padding:28px 32px;color:#ffffff;font-size:30px;font-weight:700;letter-spacing:.5px;">foodiya.app.Identity</td></tr>
        <tr><td style="height:5px;background:#04a64b;"></td></tr>
        <tr><td style="padding:40px 32px;">
          <p style="margin:0 0 12px;color:#07823e;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">{{welcome_label}}</p>
          <h1 style="margin:0 0 18px;font-size:28px;line-height:1.25;color:#214e43;">{{heading}}</h1>
          <p style="margin:0 0 18px;color:#4d655d;font-size:16px;line-height:1.7;">{{message}}</p>
          <div style="padding:18px;background:#eef8f3;border-radius:10px;color:#31594d;font-size:15px;line-height:1.6;">{{security_notice}}</div>
        </td></tr>
        <tr><td style="padding:20px 32px;background:#f8fbf9;color:#6a7e77;font-size:13px;line-height:1.5;">{{footer}}<br>{{identity_footer}}</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
